<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <rect width="360" height="160" fill="#f8fafc"/>
  <text x="180" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Role-Based Access Control</text>
  <rect x="140" y="30" width="80" height="36" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="180" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">User</text>
  <rect x="40" y="100" width="100" height="40" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="90" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#9d174d">Admin</text>
  <rect x="220" y="100" width="100" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="270" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5b21b6">Member</text>
  <path d="M160 66 L90 100" stroke="#64748b"/>
  <path d="M200 66 L270 100" stroke="#64748b"/>
  <text x="90" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">full access</text>
  <text x="270" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">read + edit own</text>
</svg>

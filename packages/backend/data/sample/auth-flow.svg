<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <rect width="420" height="120" fill="#f8fafc"/>
  <text x="210" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Authentication Flow</text>
  <rect x="20" y="40" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e40af">User</text>
  <rect x="170" y="40" width="80" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="210" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#166534">Login</text>
  <rect x="320" y="40" width="80" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Session</text>
  <path d="M100 60h60" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M250 60h60" stroke="#64748b" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="130" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">email + password</text>
  <text x="280" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">token issued</text>
</svg>
